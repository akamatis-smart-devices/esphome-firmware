# Akamatis Skopos v2 — factory configuration, firmware 1.2.0.
# Build with ESPHome 2025.5.2.
substitutions:
  hotspot_suffix: Hotspot
  device_name: akamatis-smart-device
  friendly_name: Akamatis Smart Device
  project_name: Akamatis.SmartHomeDevice
  firmware_manifest_url: https://firmware.akamatis.com/seeed-c3-ld2450/manifest.json
  firmware_version: 1.2.0
  tracking_confirm_ms: '1000'
  tracking_lost_ms: '1500'
  tracking_zone_debounce_ms: '300'
  tracking_match_radius_mm: '450'
  tracking_max_speed_mm_s: '2500'
  ghost_filter_enabled: 'true'
  ghost_duplicate_confirm_ms: '4000'
  ghost_frozen_ms: '3000'
  ghost_duplicate_radius_mm: '450'
  ghost_frozen_jitter_mm: '10'
  ghost_split_movement_mm: '600'
  ghost_recovery_movement_mm: '200'
  ghost_recovery_ms: '600'
  entity_name: ''
  tx_pin_ld2450: GPIO21
  rx_pin_ld2450: GPIO20

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: ${project_name}
    version: ${firmware_version}
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    - priority: 251
      then:
        lambda: |-
          skopos_root_navigation.begin(id(skopos_http_base));
    - priority: -200
      then:
        lambda: |-
          skopos_initialize_serial();
          skopos_state_reporter.set_identity(esphome::get_mac_address(), "${firmware_version}",
                                             skopos_create_boot_id());
          skopos::TrackingOptions tracking_options;
          tracking_options.confirm_ms = ${tracking_confirm_ms};
          tracking_options.lost_ms = ${tracking_lost_ms};
          tracking_options.zone_debounce_ms = ${tracking_zone_debounce_ms};
          tracking_options.match_radius_mm = ${tracking_match_radius_mm};
          tracking_options.max_speed_mm_s = ${tracking_max_speed_mm_s};
          tracking_options.ghost_filter_enabled = ${ghost_filter_enabled};
          tracking_options.duplicate_confirm_ms = ${ghost_duplicate_confirm_ms};
          tracking_options.ghost_frozen_ms = ${ghost_frozen_ms};
          tracking_options.duplicate_radius_mm = ${ghost_duplicate_radius_mm};
          tracking_options.frozen_jitter_mm = ${ghost_frozen_jitter_mm};
          tracking_options.split_movement_mm = ${ghost_split_movement_mm};
          tracking_options.recovery_movement_mm = ${ghost_recovery_movement_mm};
          tracking_options.recovery_ms = ${ghost_recovery_ms};
          skopos_state_reporter.configure_tracking(tracking_options);
          skopos_zone_commands.configure(
              []() {
                skopos::ZoneSettings config;
                config.rotation = int(id(wall_angle).state);
                template_::TemplateNumber *angles[] = {id(zone1_rotation_offset), id(zone2_rotation_offset),
                                                       id(zone3_rotation_offset),
                                                       id(zone_ex1_rotation_offset)};
                template_::TemplateNumber *x_coordinates[] = {id(zone1_x), id(zone2_x), id(zone3_x),
                                                              id(zone_ex1_x)};
                template_::TemplateNumber *y_coordinates[] = {id(zone1_y), id(zone2_y), id(zone3_y),
                                                              id(zone_ex1_y)};
                template_::TemplateNumber *zone_widths[] = {id(zone1_width), id(zone2_width), id(zone3_width),
                                                            id(zone_ex1_width)};
                template_::TemplateNumber *zone_heights[] = {id(zone1_height), id(zone2_height),
                                                             id(zone3_height), id(zone_ex1_height)};
                template_::TemplateSwitch *enabled_switches[] = {id(zone1_enabled), id(zone2_enabled),
                                                                 id(zone3_enabled), id(zone_ex1_enable)};
                for (unsigned i = 0; i < 4; ++i)
                  config.zones[i] = {enabled_switches[i]->state && (i == 3 || id(zone_fn_enable).state) &&
                                         zone_widths[i]->state > 0 && zone_heights[i]->state > 0,
                                     int(x_coordinates[i]->state),
                                     int(y_coordinates[i]->state),
                                     int(zone_widths[i]->state),
                                     int(zone_heights[i]->state),
                                     (int(std::lround(angles[i]->state * 10)) + config.rotation * 10) % 3600};
                return config;
              },
              [](const skopos::ZoneSettings &config) {
                auto set = [](template_::TemplateNumber *n, float v) {
                  auto call = n->make_call();
                  call.set_value(v);
                  call.perform();
                };
                set(id(wall_angle), config.rotation);
                template_::TemplateNumber *angles[] = {id(zone1_rotation_offset), id(zone2_rotation_offset),
                                                       id(zone3_rotation_offset),
                                                       id(zone_ex1_rotation_offset)};
                template_::TemplateNumber *x_coordinates[] = {id(zone1_x), id(zone2_x), id(zone3_x),
                                                              id(zone_ex1_x)};
                template_::TemplateNumber *y_coordinates[] = {id(zone1_y), id(zone2_y), id(zone3_y),
                                                              id(zone_ex1_y)};
                template_::TemplateNumber *zone_widths[] = {id(zone1_width), id(zone2_width), id(zone3_width),
                                                            id(zone_ex1_width)};
                template_::TemplateNumber *zone_heights[] = {id(zone1_height), id(zone2_height),
                                                             id(zone3_height), id(zone_ex1_height)};
                template_::TemplateSwitch *enabled_switches[] = {id(zone1_enabled), id(zone2_enabled),
                                                                 id(zone3_enabled), id(zone_ex1_enable)};
                for (unsigned i = 0; i < 4; ++i) {
                  const auto &zone_settings = config.zones[i];
                  set(angles[i],
                      ((zone_settings.rotation_tenths - config.rotation * 10 + 3600) % 3600) / 10.0f);
                  set(x_coordinates[i], zone_settings.x);
                  set(y_coordinates[i], zone_settings.y);
                  set(zone_widths[i], zone_settings.width);
                  set(zone_heights[i], zone_settings.height);
                  if (zone_settings.enabled)
                    enabled_switches[i]->turn_on();
                  else
                    enabled_switches[i]->turn_off();
                }
                if (config.zones[0].enabled || config.zones[1].enabled || config.zones[2].enabled)
                  id(zone_fn_enable).turn_on();
                else
                  id(zone_fn_enable).turn_off();
                return esphome::global_preferences->sync();
              });

          skopos_initialize_room();
          skopos_zone_commands.configure_room(
              []() -> const skopos::RoomSetting & { return skopos_room_setting; },
              [](const std::string &name) { return skopos_room_setting.set(name); });
          skopos_initialize_prediction();
          skopos_prediction_changed = []() {
            id(prediction_lead_time).publish_state(skopos_prediction_setting.lead_ms() / 1000.0f);
            id(prediction_setting_saved).publish_state(skopos_prediction_setting.saved());
            id(zone1_early_entry).publish_state(false);
            id(zone2_early_entry).publish_state(false);
            id(zone3_early_entry).publish_state(false);
          };
          skopos_prediction_changed();
          skopos_zone_commands.configure_prediction(
              []() -> const skopos::PredictionSetting & { return skopos_prediction_setting; },
              [](uint32_t value) { return skopos_set_prediction(value); });
          skopos_web_editor.begin(id(skopos_http_base));

          id(zone1_target_exist).publish_state(false);
          id(zone2_target_exist).publish_state(false);
          id(zone3_target_exist).publish_state(false);
          id(zone_ex1_target_exist).publish_state(false);
    - priority: -100
      then:
        - delay: 3s
        - switch.turn_on: radar_multi_target
  includes:
    - ../private/firmware/include/radar_entities.h
    - ../private/firmware/include/radar_frame.h
    - ../private/firmware/include/tracking.h
    - ../private/firmware/include/state_reporter.h
    - ../private/firmware/include/serial_transport.h
    - ../private/firmware/include/zone_settings.h
    - ../private/firmware/include/zone_commands.h
    - ../private/firmware/include/prediction_settings.h
    - ../private/firmware/include/trajectory_prediction.h
    - ../private/firmware/include/room_settings.h
    - ../private/firmware/include/room_runtime.h
    - ../private/firmware/include/prediction_runtime.h
    - ../private/firmware/include/ha_map_packets.h
    - ../private/firmware/include/web_command_codec.h
    - ../private/firmware/include/zone_web_server.h
    - ../private/firmware/include/device_navigation.h
# Private sources are required. Generate current assets before includes are copied.
external_components:
  - source:
      type: local
      path: ../private/components
    components: [skopos_assets]
skopos_assets: {}
preferences:
  flash_write_interval: 5s
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BOOTLOADER_LOG_LEVEL_NONE: y
globals:
  - id: zone_states_initialized
    type: bool
    restore_value: false
    initial_value: 'false'
logger:
  level: DEBUG
debug:
  update_interval: 30s
http_request:
  verify_ssl: true
  timeout: 20s
  watchdog_timeout: 60s
api:
  reboot_timeout: 0s
  # Check for firmware updates when an API client (HA) reconnects
  on_client_connected:
    then:
      - delay: 30s
      - component.update: firmware_update
wifi:
  power_save_mode: NONE
  reboot_timeout: 0s
  ap:
    ssid: ${friendly_name} ${hotspot_suffix}
    password: ''
    ap_timeout: 1min

captive_portal: null
ota:
  - platform: esphome
    password: ''
  - platform: http_request

update:
  - platform: http_request
    id: firmware_update
    name: "03: MCU Firmware"
    source: "${firmware_manifest_url}"
    update_interval: 6h
    device_class: firmware
    entity_category: ""

web_server_base:
  id: skopos_http_base
web_server:
  version: 2
  web_server_base_id: skopos_http_base
  port: 80
