ld2450:
  id: radar_config
  uart_id: uart_bus
uart:
  id: uart_bus
  tx_pin: ${tx_pin_ld2450}
  rx_pin:
    number: ${rx_pin_ld2450}
    mode:
      input: true
      pullup: true
  baud_rate: 256000
  parity: NONE
  stop_bits: 1
  data_bits: 8
  debug:
    direction: RX
    dummy_receiver: false
    after:
      delimiter:
        - 0X55
        - 0XCC
    sequence:
      - lambda: |-
          if (!skopos::valid_frame(bytes.data(), bytes.size()))
            return;
          static template_::TemplateNumber *zone_x[] = {id(zone1_x), id(zone2_x), id(zone3_x)};
          static template_::TemplateNumber *zone_y[] = {id(zone1_y), id(zone2_y), id(zone3_y)};
          static template_::TemplateNumber *zone_height[] = {id(zone1_height), id(zone2_height),
                                                             id(zone3_height)};
          static template_::TemplateNumber *zone_width[] = {id(zone1_width), id(zone2_width),
                                                            id(zone3_width)};
          static template_::TemplateSensor *zone_target_count[] = {
              id(zone1_target_count), id(zone2_target_count), id(zone3_target_count)};
          static template_::TemplateBinarySensor *zone_target_exist[] = {
              id(zone1_target_exist), id(zone2_target_exist), id(zone3_target_exist)};
          const int NUM_ZONES = 3;

          static template_::TemplateSwitch *zone_ex_enable[] = {id(zone_ex1_enable)};
          static template_::TemplateNumber *zone_ex_x[] = {id(zone_ex1_x)};
          static template_::TemplateNumber *zone_ex_y[] = {id(zone_ex1_y)};
          static template_::TemplateNumber *zone_ex_height[] = {id(zone_ex1_height)};
          static template_::TemplateNumber *zone_ex_width[] = {id(zone_ex1_width)};
          static template_::TemplateSensor *zone_ex_target_count[] = {id(zone_ex1_target_count)};
          static template_::TemplateBinarySensor *zone_ex_target_exist[] = {id(zone_ex1_target_exist)};
          const int NUM_ZONES_EX = 1;
          static template_::TemplateSensor *target_angle[] = {id(target1_angle), id(target2_angle),
                                                              id(target3_angle)};
          static template_::TemplateTextSensor *target_position[] = {
              id(target1_position), id(target2_position), id(target3_position)};
          static template_::TemplateTextSensor *target_direction[] = {
              id(target1_direction), id(target2_direction), id(target3_direction)};
          static template_::TemplateSensor *target_x[] = {id(target1_x), id(target2_x), id(target3_x)};
          static template_::TemplateSensor *target_y[] = {id(target1_y), id(target2_y), id(target3_y)};
          static template_::TemplateSensor *target_speed[] = {id(target1_speed), id(target2_speed),
                                                              id(target3_speed)};
          static template_::TemplateSensor *target_resolution[] = {
              id(target1_resolution), id(target2_resolution), id(target3_resolution)};
          const int NUM_TARGETS = 3;
          const auto active_zone_settings = skopos_zone_commands.settings();

          auto positions = skopos::decode_radar_frame(bytes.data());
          RadarZoneState zone_ex[NUM_ZONES_EX], zone[NUM_ZONES];

          for (int i = 0; i < NUM_ZONES_EX; i++) {
            zone_ex[i].x = zone_ex_x[i]->state;
            zone_ex[i].y = zone_ex_y[i]->state;
            zone_ex[i].width = zone_ex_width[i]->state;
            zone_ex[i].height = zone_ex_height[i]->state;

            if (zone_ex_enable[i]->state) {
              for (int j = 0; j < NUM_TARGETS; j++) {
                if (positions[j].detected) {
                  const auto &exclusion_settings = active_zone_settings.zones[3];
                  const skopos::ZoneConfig exclusion_geometry{
                      exclusion_settings.enabled,       float(exclusion_settings.x),
                      float(exclusion_settings.y),      float(exclusion_settings.width),
                      float(exclusion_settings.height), exclusion_settings.rotation_tenths / 10.0f};
                  if (exclusion_geometry.contains(positions[j].x, positions[j].y)) {
                    zone_ex[i].target_count++;
                    positions[j].inside_exclusion_zone = true;
                  } else {
                    zone_ex[i].outside_target_count++;
                  }
                }
              }
            }
            zone_ex[i].has_target = (zone_ex[i].target_count > 0);
            zone_ex[i].has_target_outside = (zone_ex[i].outside_target_count > 0);
          }
          std::array<skopos::Target, 3> radar_targets{};
          for (int i = 0; i < NUM_TARGETS; ++i) {
            radar_targets[i].detected = positions[i].detected;
            radar_targets[i].excluded = positions[i].inside_exclusion_zone;
            radar_targets[i].x_mm = positions[i].x;
            radar_targets[i].y_mm = positions[i].y;
            radar_targets[i].speed_cm_s = positions[i].speed;
            radar_targets[i].resolution_mm = positions[i].distance_resolution;
          }
          std::array<skopos::ZoneConfig, 3> tracking_zones{};
          for (int i = 0; i < NUM_ZONES; ++i) {
            template_::TemplateSwitch *zone_enabled[] = {id(zone1_enabled), id(zone2_enabled),
                                                         id(zone3_enabled)};
            tracking_zones[i] = {id(zone_fn_enable).state && zone_enabled[i]->state,
                                 zone_x[i]->state,
                                 zone_y[i]->state,
                                 zone_width[i]->state,
                                 zone_height[i]->state,
                                 active_zone_settings.zones[i].rotation_tenths / 10.0f};
          }
          skopos_state_reporter.set_tracking_zones(tracking_zones, millis());
          skopos_state_reporter.record(radar_targets, millis());
          int16_t all_target_counts = 0;
          for (int i = 0; i < NUM_TARGETS; i++) {
            if (positions[i].detected && !positions[i].inside_exclusion_zone) {
              all_target_counts++;
            }
          }

          bool has_target_in_zone_all = (all_target_counts > 0);
          if (id(zone_fn_enable).state) {
            for (int i = 0; i < NUM_ZONES; i++) {
              template_::TemplateSwitch *zone_enabled[] = {id(zone1_enabled), id(zone2_enabled),
                                                           id(zone3_enabled)};
              zone[i].x = zone_x[i]->state;
              zone[i].y = zone_y[i]->state;
              zone[i].width = zone_width[i]->state;
              zone[i].height = zone_height[i]->state;

              for (int j = 0; j < NUM_TARGETS; j++) {
                if (positions[j].detected && !positions[j].inside_exclusion_zone && zone_enabled[i]->state) {
                  const auto &detection_settings = active_zone_settings.zones[i];
                  const skopos::ZoneConfig detection_geometry{
                      detection_settings.enabled,       float(detection_settings.x),
                      float(detection_settings.y),      float(detection_settings.width),
                      float(detection_settings.height), detection_settings.rotation_tenths / 10.0f};
                  if (detection_geometry.contains(positions[j].x, positions[j].y)) {
                    zone[i].target_count++;
                  } else {
                    zone[i].outside_target_count++;
                  }
                }
              }
              zone[i].has_target = (zone[i].target_count > 0);
              zone[i].has_target_outside = (zone[i].outside_target_count > 0);
            }
          }
          for (int i = 0; i < NUM_TARGETS; i++) {
            if (positions[i].detected) {
              positions[i].angle = skopos::bearing_degrees(positions[i].x, positions[i].y);
            }
            if (target_angle[i]->state != positions[i].angle && id(target_fn_enable).state) {
              target_angle[i]->publish_state(positions[i].angle);
            }

            if (positions[i].speed > 0) {
              positions[i].position = "Moving away";
            } else if (positions[i].speed < 0) {
              positions[i].position = "Approaching";
            }
            if (positions[i].position != target_position[i]->state && id(target_fn_enable).state) {
              target_position[i]->publish_state(positions[i].position);
            }

            if (positions[i].x > 0) {
              positions[i].direction = "Right";
            } else if (positions[i].x < 0) {
              positions[i].direction = "Left";
            } else if (positions[i].y > 0) {
              positions[i].direction = "Middle";
            }
            if (positions[i].direction != target_direction[i]->state && id(target_fn_enable).state) {
              target_direction[i]->publish_state(positions[i].direction);
            }
          }
          for (int i = 0; i < NUM_TARGETS; i++) {
            if (target_x[i]->state != positions[i].x && id(target_fn_enable).state) {
              target_x[i]->publish_state(positions[i].x);
            }
            if (target_y[i]->state != positions[i].y && id(target_fn_enable).state) {
              target_y[i]->publish_state(positions[i].y);
            }

            const float speed_meters_per_second = positions[i].speed / 100.0f;
            if (target_speed[i]->state != speed_meters_per_second && id(target_fn_enable).state) {
              target_speed[i]->publish_state(speed_meters_per_second);
            }
            if (target_resolution[i]->state != positions[i].distance_resolution &&
                id(target_fn_enable).state) {
              target_resolution[i]->publish_state(positions[i].distance_resolution);
            }
          }
          if (id(all_target_count).state != all_target_counts) {
            id(all_target_count).publish_state(all_target_counts);
            id(any_target_exist).publish_state(has_target_in_zone_all);
          } else if (id(any_target_exist).state != has_target_in_zone_all) {
            id(any_target_exist).publish_state(has_target_in_zone_all);
          }

          for (int i = 0; i < NUM_ZONES; i++) {
            if (zone_target_count[i]->state != zone[i].target_count) {
              zone_target_count[i]->publish_state(zone[i].target_count);
              zone_target_exist[i]->publish_state(zone[i].has_target);
            }
          }
          for (int i = 0; i < NUM_ZONES_EX; i++) {
            if (zone_ex_target_count[i]->state != zone_ex[i].target_count) {
              zone_ex_target_count[i]->publish_state(zone_ex[i].target_count);
            }
            if (zone_ex_target_exist[i]->state != zone_ex[i].has_target) {
              zone_ex_target_exist[i]->publish_state(zone_ex[i].has_target);
            }
          }

          if (!id(zone_states_initialized)) {
            id(zone_states_initialized) = true;
          }
interval:
  - interval: 500ms
    then:
      - lambda: |-
          if (!skopos_zone_commands.ready())
            return;
          static const std::string ha_boot = skopos_ha::boot_id();
          template_::TemplateBinarySensor *presence[] = {id(zone1_target_exist), id(zone2_target_exist),
                                                         id(zone3_target_exist), id(zone_ex1_target_exist)};
          std::array<int, 4> states{};
          for (unsigned i = 0; i < 4; i++)
            states[i] = presence[i]->has_state() ? int(presence[i]->state) : -1;
          const auto packets = skopos_ha::encode(skopos_state_reporter.tracker(),
                                                 skopos_zone_commands.settings(), ha_boot, millis(), states);
          text_sensor::TextSensor *tracks[] = {id(skopos_map_track1), id(skopos_map_track2),
                                               id(skopos_map_track3), id(skopos_map_track4),
                                               id(skopos_map_track5), id(skopos_map_track6)};
          text_sensor::TextSensor *zones[] = {id(skopos_map_zone1), id(skopos_map_zone2),
                                              id(skopos_map_zone3), id(skopos_map_zone4)};
          for (unsigned i = 0; i < 6; i++)
            tracks[i]->publish_state(packets.tracks[i]);
          for (unsigned i = 0; i < 4; i++)
            zones[i]->publish_state(packets.zones[i]);
          id(skopos_map_frame).publish_state(packets.frame);
  - interval: 20ms
    then:
      - lambda: |-
          skopos_web_editor.poll_commands();
          skopos_poll_serial_commands();
          skopos::Snapshot state;
          const auto zone_config = skopos_zone_commands.settings();
          state.zone_config = skopos::zone_settings_json(zone_config);
          state.room = skopos_room_setting.json();
          state.prediction = skopos_prediction_setting.json();
          const auto early = skopos_prediction.update(skopos_state_reporter.tracker(), zone_config,
                                                      skopos_prediction_setting.lead_ms(), millis());
          template_::TemplateBinarySensor *early_entry[] = {id(zone1_early_entry), id(zone2_early_entry),
                                                           id(zone3_early_entry)};
          for (unsigned i = 0; i < 3; ++i)
            if (!early_entry[i]->has_state() || early_entry[i]->state != early[i])
              early_entry[i]->publish_state(early[i]);
          std::array<skopos::ZoneConfig, 3> configured_tracking_zones{};
          for (unsigned i = 0; i < 3; ++i) {
            const auto &zone_settings = zone_config.zones[i];
            configured_tracking_zones[i] = {
                zone_settings.enabled,       float(zone_settings.x),
                float(zone_settings.y),      float(zone_settings.width),
                float(zone_settings.height), zone_settings.rotation_tenths / 10.0f};
          }
          skopos_state_reporter.set_tracking_zones(configured_tracking_zones, millis());
          state.presence = id(any_target_exist).has_state() ? int(id(any_target_exist).state) : -1;
          state.count = skopos::sensor_count(id(all_target_count).state);
          template_::TemplateBinarySensor *presence[] = {id(zone1_target_exist), id(zone2_target_exist),
                                                         id(zone3_target_exist)};
          template_::TemplateSensor *counts[] = {id(zone1_target_count), id(zone2_target_count),
                                                 id(zone3_target_count)};
          for (int i = 0; i < 3; ++i) {
            state.zones[i].enabled = zone_config.zones[i].enabled;
            state.zones[i].presence = presence[i]->has_state() ? int(presence[i]->state) : -1;
            state.zones[i].count = skopos::sensor_count(counts[i]->state);
          }
          state.exclusion.enabled = id(zone_ex1_enable).state && id(zone_ex1_width).state > 0 &&
                                    id(zone_ex1_height).state > 0;
          state.exclusion.presence =
              id(zone_ex1_target_exist).has_state() ? int(id(zone_ex1_target_exist).state) : -1;
          state.exclusion.count = skopos::sensor_count(id(zone_ex1_target_count).state);
          skopos_web_editor.publish(state, millis());
          skopos_state_reporter.tick(state, millis(), [](const char *data, size_t size) {
            return skopos_serial_ready ? usb_serial_jtag_write_bytes(data, size, 0) : 0;
          });
