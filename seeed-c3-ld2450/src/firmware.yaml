    name: ${entity_name} Prediction Lead Time
    id: prediction_lead_time
    entity_category: config
    unit_of_measurement: s
    icon: mdi:walk
    min_value: 0
    max_value: 3
    step: 0.1
    update_interval: never
    lambda: return skopos_prediction_setting.lead_ms() / 1000.0f;
    set_action:
      - lambda: |-
          if (std::isfinite(x) && x >= 0 && x <= 2)
            skopos_set_prediction(uint32_t(std::lround(x * 1000)));
