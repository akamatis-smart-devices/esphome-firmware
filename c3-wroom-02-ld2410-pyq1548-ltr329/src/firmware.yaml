substitutions:
  device_name: akamatis-smart-device
  friendly_name: Akamatis Smart Device
  project_name: Akamatis.SmartHomeDevice
  firmware_version: "1.0.0"
  firmware_manifest_url: https://firmware.akamatis.com/c3-wroom-02-ld2410-pyq1548-ltr329/manifest.json
  esp32_tx_pin: GPIO21
  esp32_rx_pin: GPIO20
  hotspot_suffix: "Hotspot"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: True
  project:
    name: ${project_name}
    version: ${firmware_version}

  # Provision the LD2410C once after a clean factory flash. The restored
  # global prevents ordinary restarts and OTA updates from resetting it.
  on_boot:
    - priority: -100
      then:
        - if:
            condition:
              lambda: return !id(radar_factory_reset_done);
            then:
              # Allow the radar to finish starting before sending commands.
              - delay: 5s

              - logger.log:
                  level: INFO
                  tag: provisioning
                  format: "Applying LD2410C factory defaults"

              - button.press: radar_factory_reset
              - delay: 3s

              - button.press: radar_restart
              - delay: 3s

              - button.press: radar_query_params
              - delay: 2s

              - globals.set:
                  id: radar_factory_reset_done
                  value: "true"

              # Allow the restored global to be persisted before power is
              # removed at the production station.
              - delay: 2s

              - logger.log:
                  level: INFO
                  tag: provisioning
                  format: "LD2410C factory provisioning complete"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

debug:
  update_interval: 60s

wifi:
  power_save_mode: LIGHT
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name} ${hotspot_suffix}"
    password: ""
    ap_timeout: 1min

improv_serial:

captive_portal:

api:
  # Check for firmware updates when an API client (HA) reconnects
  on_client_connected:
    then:
      - delay: 30s
      - component.update: firmware_update

ota:
  - platform: esphome
    password: ""

  - platform: http_request

http_request:
  verify_ssl: true
  timeout: 20s
  watchdog_timeout: 60s

update:
  - platform: http_request
    id: firmware_update
    name: "06: MCU Firmware"
    source: "${firmware_manifest_url}"
    update_interval: 6h
    device_class: firmware
    entity_category: ""

external_components:
  - source:
      type: git
      url: https://github.com/akamatis-smart-devices/esphome-custom.git
      path: components
    components: [ld2410, ap01d_core, ap01d]

globals:
  - id: radar_factory_reset_done
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: calibration_running
    type: bool
    restore_value: no
    initial_value: "false"

  - id: calibration_seconds_total
    type: int
    restore_value: no
    initial_value: "0"

  - id: calibration_seconds_elapsed
    type: int
    restore_value: no
    initial_value: "0"

  - id: max_move
    type: int[9]
    restore_value: no

  - id: max_still
    type: int[9]
    restore_value: no

uart:
  id: uart_bus
  tx_pin: ${esp32_tx_pin}
  rx_pin: ${esp32_rx_pin}
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  uart_id: uart_bus
  id: ld2410_comp

button:
  - platform: ld2410
    query_params:
      name: "01: Radar - Refresh values"
      id: radar_query_params
      icon: mdi:database-sync-outline
      entity_category: ""

    restart:
      name: "02: Radar - Restart"
      id: radar_restart
      entity_category: ""

    factory_reset:
      name: "03: Radar - Factory reset"
      id: radar_factory_reset
      entity_category: ""

  - platform: restart
    name: "04: ESP32 - Restart"
    id: restart_esp32
    entity_category: ""

  - platform: factory_reset
    name: "05: ESP32 - Factory reset"
    entity_category: ""

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return id(calibration_running);
          then:
            - lambda: |-
                float move_energy[9] = {
                  id(g0_move_energy).state,
                  id(g1_move_energy).state,
                  id(g2_move_energy).state,
                  id(g3_move_energy).state,
                  id(g4_move_energy).state,
                  id(g5_move_energy).state,
                  id(g6_move_energy).state,
                  id(g7_move_energy).state,
                  id(g8_move_energy).state
                };

                float still_energy[9] = {
                  id(g0_still_energy).state,
                  id(g1_still_energy).state,
                  id(g2_still_energy).state,
                  id(g3_still_energy).state,
                  id(g4_still_energy).state,
                  id(g5_still_energy).state,
                  id(g6_still_energy).state,
                  id(g7_still_energy).state,
                  id(g8_still_energy).state
                };

                for (int gate = 0; gate < 9; gate++) {
                  int move = (int) move_energy[gate];
                  int still = (int) still_energy[gate];

                  int new_max_move = std::max(id(max_move)[gate], move);
                  int new_max_still = std::max(id(max_still)[gate], still);

                  ESP_LOGD("Calibration", "Gate %d | Move energy: %d (max %d) | Still energy: %d (max %d)",
                           gate,
                           move, new_max_move,
                           still, new_max_still);

                  if (new_max_move <= 100)
                    id(max_move)[gate] = new_max_move;
                  if (new_max_still <= 100)
                    id(max_still)[gate] = new_max_still;
                }

                id(calibration_seconds_elapsed)++;

                int left =
                  id(calibration_seconds_total)
                  - id(calibration_seconds_elapsed);

                id(calibration_status)->publish_state(
                  std::to_string(left) + "s left"
                );

                if (id(calibration_seconds_elapsed) >=
                    id(calibration_seconds_total)) {

                  id(finish_calibration).execute();
                }

  # Engineering Mode should not be left enabled for extended periods,
  # as it can overload the UART bus and cause the radar to stop outputting data.
  - interval: 60min
    then:
      - lambda: |-
          if (id(engineering_mode).state && !id(calibration_running)) {
            ESP_LOGW("ld2410", "Turning OFF the engineering mode: ...");
            id(engineering_mode).turn_off();
          }

script:
  - id: finish_calibration

    then:
      - lambda: |-
          id(calibration_running) = false;
          id(auto_calibration).publish_state(false);
          
          id(engineering_mode).publish_state(false);
          id(ld2410_comp).set_engineering_mode(false);

          number::Number* move_thr[9] = {
            id(g0_move_thr),
            id(g1_move_thr),
            id(g2_move_thr),
            id(g3_move_thr),
            id(g4_move_thr),
            id(g5_move_thr),
            id(g6_move_thr),
            id(g7_move_thr),
            id(g8_move_thr)
          };

          number::Number* still_thr[9] = {
            id(g0_still_thr),
            id(g1_still_thr),
            id(g2_still_thr),
            id(g3_still_thr),
            id(g4_still_thr),
            id(g5_still_thr),
            id(g6_still_thr),
            id(g7_still_thr),
            id(g8_still_thr)
          };

          ld2410::LD2410Component* radar = id(ld2410_comp);

          int margin =
            (int) id(noise_margin).state;

          for (int gate = 0; gate < 9; gate++) {

            int move_threshold =
              std::min(100, id(max_move)[gate] + margin);

            int still_threshold =
              std::min(100, id(max_still)[gate] + margin);

            if (move_threshold > move_thr[gate]->state)
              move_thr[gate]->publish_state(move_threshold);
            if (still_threshold > still_thr[gate]->state)
              still_thr[gate]->publish_state(still_threshold);
          }

          radar->set_gate_thresholds();

      - text_sensor.template.publish:
          id: calibration_status
          state: "Complete"

select:
  - platform: ld2410
    distance_resolution:
      name: Distance resolution
      disabled_by_default: true

    baud_rate:
      name: Baud rate
      disabled_by_default: true

binary_sensor:
  - platform: ld2410
    has_target:
      name: "030: Radar - Presence"
    has_moving_target:
      name: "032: Radar - Moving Target"
    has_still_target:
      name: "035: Radar - Still Target"

text_sensor:
  - platform: debug
    reset_reason:
      name: "ESP32 - Last Reset Reason"
      entity_category: diagnostic
      disabled_by_default: true

  - platform: template
    name: "01: Calibration status"
    id: calibration_status
    icon: mdi:auto-fix
    entity_category: diagnostic

  - platform: ld2410
    version:
      name: "02: Radar Firmware"
    mac_address:
      name: "03: MAC address"

switch:
  - platform: template
    name: "020: Radar - Auto Calibration"
    id: auto_calibration
    icon: mdi:auto-fix
    entity_category: config
    optimistic: false

    turn_on_action:
        - lambda: |-
            id(auto_calibration).publish_state(true);
            id(calibration_running) = true;

            id(calibration_seconds_total) =
              (int) id(calibration_duration).state * 60;

            id(calibration_seconds_elapsed) = 0;

            for (int gate = 0; gate < 9; gate++) {
              id(max_move)[gate] = 0;
              id(max_still)[gate] = 0;
            }

            id(ld2410_comp).set_engineering_mode(true);

    turn_off_action:
      - if:
          condition:
            lambda: return id(calibration_running);
          then:
            - script.execute: finish_calibration

  - platform: ld2410
    engineering_mode:
      id: engineering_mode
      name: "026: Radar - Engineering Mode"

    bluetooth:
      name: Bluetooth
      disabled_by_default: true

ap01d:
  id: pir_sensor
  direct_link_pin: 3
  serin_pin: 4
  update_interval: 50ms

  motion_threshold: 100
  required_hits: 2
  motion_hold: 5s

  motion:
    name: "020: PIR - Motion"

  pir_bpf:
    id: ap01d_pir_bpf
    name: "022: PIR - Raw Signal"
    disabled_by_default: true

  config_ok:
    name: "023: PIR - Data Status"
    device_class: problem
    entity_category: diagnostic
    disabled_by_default: true
    filters:
      - invert:
      - delayed_off: 5s

number:
  - platform: template
    name: "010: PIR - Motion Threshold"
    id: AP01D_motion_threshold
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 20
    max_value: 500
    step: 5
    set_action:
      - lambda: |-
          id(pir_sensor).set_motion_threshold((int16_t) x);

  - platform: template
    name: "011: PIR - Required Samples"
    id: AP01D_required_hits
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 2
    min_value: 1
    max_value: 10
    step: 1
    set_action:
      - lambda: |-
          id(pir_sensor).set_required_hits((uint8_t) x);

  - platform: template
    name: "012: PIR - Motion Hold"
    id: AP01D_motion_hold
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 0
    max_value: 30
    step: 1
    mode: box
    unit_of_measurement: "s"
    set_action:
      - lambda: |-
          id(pir_sensor).set_motion_hold_ms((uint32_t) (x * 1000.0f));

  - platform: template
    name: "021: Radar - Calibration Time"
    id: calibration_duration
    entity_category: config
    icon: mdi:auto-fix
    unit_of_measurement: "min"
    min_value: 1
    max_value: 10
    step: 1
    mode: box
    optimistic: true
    initial_value: 1

  - platform: template
    name: "022: Radar - Calibration Margin"
    id: noise_margin
    entity_category: config
    icon: mdi:auto-fix
    unit_of_measurement: "%"
    min_value: 5
    max_value: 15
    step: 5
    mode: box
    optimistic: true
    initial_value: 5

  - platform: ld2410
    timeout:
      name: "023: Radar - Presence Hold"
    max_move_distance_gate:
      name: "024: Radar - Max Move Gate"
    max_still_distance_gate:
      name: "025: Radar - Max Still Gate"

    g0:
      move_threshold:
        name: G0 move threshold
        id: g0_move_thr
      still_threshold:
        name: G0 still threshold
        id: g0_still_thr

    g1:
      move_threshold:
        name: G1 move threshold
        id: g1_move_thr
      still_threshold:
        name: G1 still threshold
        id: g1_still_thr

    g2:
      move_threshold:
        name: G2 move threshold
        id: g2_move_thr
      still_threshold:
        name: G2 still threshold
        id: g2_still_thr

    g3:
      move_threshold:
        name: G3 move threshold
        id: g3_move_thr
      still_threshold:
        name: G3 still threshold
        id: g3_still_thr

    g4:
      move_threshold:
        name: G4 move threshold
        id: g4_move_thr
      still_threshold:
        name: G4 still threshold
        id: g4_still_thr

    g5:
      move_threshold:
        name: G5 move threshold
        id: g5_move_thr
      still_threshold:
        name: G5 still threshold
        id: g5_still_thr

    g6:
      move_threshold:
        name: G6 move threshold
        id: g6_move_thr
      still_threshold:
        name: G6 still threshold
        id: g6_still_thr

    g7:
      move_threshold:
        name: G7 move threshold
        id: g7_move_thr
      still_threshold:
        name: G7 still threshold
        id: g7_still_thr

    g8:
      move_threshold:
        name: G8 move threshold
        id: g8_move_thr
      still_threshold:
        name: G8 still threshold
        id: g8_still_thr

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true
  id: bus_a

sensor:
  - platform: debug
    free:
      name: "ESP32 - Free Heap"
      entity_category: diagnostic
      disabled_by_default: true

  # Customer-facing PIR signal magnitude. At a 50 ms source interval, five
  # samples equal 250 ms. Taking the absolute maximum prevents positive and
  # negative samples from cancelling while limiting Home Assistant history to
  # four updates per second.
  - platform: copy
    source_id: ap01d_pir_bpf
    name: "021: PIR - Signal Strength"
    filters:
      - lambda: return fabsf(x);
      - max:
          window_size: 5
          send_every: 5
          send_first_at: 5

  - platform: ltr_als_ps
    id: ltr329
    type: ALS
    address: 0x29
    update_interval: 15s

    auto_mode: false
    gain: 8X
    integration_time: 100ms
    
    # Adjust later if sensor is behind a plastic window
    glass_attenuation_factor: 3.0

    ambient_light:
      name: "01: Ambient Light"
      id: ambient_light
      accuracy_decimals: 1

  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 5s

  - platform: uptime
    name: "04: ESP32 - Uptime"
    type: seconds
    update_interval: 60s
    entity_category: diagnostic
    disabled_by_default: true

  # Main Unit: human presence (ld2401/ld2410)
  - platform: ld2410
    moving_distance:
      name: "033: Radar - Moving Distance"
    still_distance:
      name: "036: Radar - Still Distance"
    moving_energy:
      name: "034: Radar - Moving Energy"
    still_energy:
      name: "037: Radar - Still Energy"
    detection_distance:
      id: detection_distance
      name: "031: Radar - Detection Distance"

    g0:
      move_energy:
        name: G0 move energy
        id: g0_move_energy
      still_energy:
        name: G0 still energy
        id: g0_still_energy

    g1:
      move_energy:
        name: G1 move energy
        id: g1_move_energy
      still_energy:
        name: G1 still energy
        id: g1_still_energy

    g2:
      move_energy:
        name: G2 move energy
        id: g2_move_energy
      still_energy:
        name: G2 still energy
        id: g2_still_energy

    g3:
      move_energy:
        name: G3 move energy
        id: g3_move_energy
      still_energy:
        name: G3 still energy
        id: g3_still_energy

    g4:
      move_energy:
        name: G4 move energy
        id: g4_move_energy
      still_energy:
        name: G4 still energy
        id: g4_still_energy

    g5:
      move_energy:
        name: G5 move energy
        id: g5_move_energy
      still_energy:
        name: G5 still energy
        id: g5_still_energy

    g6:
      move_energy:
